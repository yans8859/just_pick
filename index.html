<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>帮你选</title>
<meta name="theme-color" content="#15152c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="帮你选">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 离线版本：不使用外网字体，改用系统自带中英文字体 -->
<style>
  :root {
    color-scheme: dark;
    --bg: #15152c;
    --surface: #24244a;
    --surface2: #1d1d3d;
    --input: #12122a;
    --gold: #E8C547;
    --gold2: #ffd76e;
    --accent: #7B68EE;
    --accent2: #9d8bff;
    --pink: #E85D75;
    --teal: #4ECDC4;
    --text: #EFEFFF;
    --muted: #8d8db0;
    --border: #32325c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #3a3a66 #14142a; }
  body {
    background:
      radial-gradient(70% 45% at 50% -8%, rgba(123,104,238,.20), transparent 62%),
      radial-gradient(55% 40% at 12% 108%, rgba(78,205,196,.09), transparent 60%),
      linear-gradient(180deg, #141430 0%, #181832 45%, #13132a 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(38% 28% at 88% 12%, rgba(232,197,71,.08), transparent 65%),
      radial-gradient(30% 24% at 10% 60%, rgba(123,104,238,.10), transparent 70%);
    pointer-events: none;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes diceIn { from { transform: scale(.4) rotate(-18deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .opt-name.shake { animation: shake .35s ease; border-color: var(--pink) !important; box-shadow: 0 0 0 3px rgba(232,93,117,.18) !important; }
  ::selection { background: rgba(232,197,71,.28); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a66; border-radius: 8px; border: 2px solid #14142a; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a7e; }
  ::-webkit-scrollbar-track { background: transparent; }
  input { font-family: inherit; }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .header { padding: 44px 24px 0; text-align: center; animation: fadeUp .5s ease; }
  .header h1 {
    font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;
    background: linear-gradient(120deg, #fff 10%, var(--gold2) 45%, var(--gold) 62%, var(--accent2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header h1 span {
    background: linear-gradient(120deg, var(--gold), var(--gold2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header p { color: var(--muted); font-size: 14px; letter-spacing: .04em; }
  .lang-btn { margin-top: 10px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--accent2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .18s; }
  .lang-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 28px 24px 0; }
  .tab {
    padding: 9px 22px; border-radius: 999px; border: 1px solid transparent;
    background: rgba(36,36,74,.55); color: var(--muted); font-weight: 600; cursor: pointer;
    font-size: 14.5px; transition: all .22s ease; backdrop-filter: blur(6px);
  }
  .tab:hover { color: var(--text); background: rgba(46,46,92,.8); border-color: var(--border); transform: translateY(-1px); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), #5b4bd6 60%, var(--accent2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(123,104,238,.35), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .main { flex: 1; padding: 34px 24px 60px; }
  .mode { display: none; }
  .mode.active { display: flex; flex-direction: column; align-items: center; gap: 22px; animation: fadeUp .35s ease; }

  /* Wheel */
  .wheel-wrap { position: relative; padding: 14px; }
  .wheel-wrap::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 0deg, var(--gold), var(--accent), var(--teal), var(--pink), var(--gold));
    filter: blur(12px); opacity: .5;
  }
  .wheel-wrap::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), 0 24px 50px rgba(0,0,0,.5);
  }
  canvas { display: block; position: relative; z-index: 1; width: 320px; max-width: 100%; height: auto; cursor: pointer; }
  .result {
    font-size: 30px; font-weight: 800; text-align: center;
    background: linear-gradient(120deg, var(--gold2), var(--gold) 55%, #ffb84d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 14px rgba(232,197,71,.35));
    animation: fadeUp .4s ease;
  }
  .hint { color: var(--muted); font-size: 14px; }
  .input-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .input-row input, .record-bar input {
    flex: 1; min-width: 0; padding: 11px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--input); color: var(--text); font-size: 15px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-row input:focus, .record-bar input:focus, .card input:focus, .score-table input:focus, .fate-opts input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,104,238,.22);
  }
  .input-row button {
    padding: 11px 18px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--accent), #5b4bd6);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 16px;
    box-shadow: 0 5px 14px rgba(123,104,238,.3); transition: all .18s;
  }
  .input-row button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(123,104,238,.42); }
  .input-row button:active { transform: translateY(0); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; max-width: 360px; justify-content: center; }
  .chip {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    animation: popIn .25s ease;
  }
  .chip:hover { border-color: #4a4a7e; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; transition: all .15s; }
  .chip button:hover { color: var(--pink); transform: scale(1.15); }

  /* Weigh */
  .weigh { max-width: 700px; margin: 0 auto; width: 100%; gap: 22px; }
  .weigh-q {
    font-size: 19px; font-weight: 600; text-align: center; background: transparent;
    border: none; border-bottom: 1px dashed var(--border); color: var(--text);
    width: 100%; padding: 8px; font-family: inherit; transition: border-color .2s;
  }
  .weigh-q:focus { outline: none; border-bottom-color: var(--accent); }
  .weigh-q::placeholder { color: var(--muted); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cards.three { grid-template-columns: 1fr 1fr 1fr; }
  .cards.four { grid-template-columns: 1fr 1fr; }
  .card {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border-radius: 16px; padding: 18px; border: 1.5px solid var(--border);
    box-shadow: 0 10px 26px rgba(0,0,0,.28);
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-2px); border-color: #44447a; }
  .card.winner { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 12px 32px rgba(232,197,71,.18); }
  .card input[type="text"], .score-table input, .fate-opts input {
    padding: 9px 12px; border-radius: 10px; border: 1px solid transparent;
    background: var(--input); color: var(--text); font-size: 14px; width: 100%;
    font-family: inherit; transition: border-color .2s, box-shadow .2s;
  }
  .card input[type="text"]:focus, .score-table input:focus, .fate-opts input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,104,238,.2);
  }
  .opt-name-row { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
  .card .opt-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
  .suggest-btn {
    flex: none; width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #8a6ff0); color: #fff; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(123,104,238,.35); transition: all .18s;
  }
  .suggest-btn:hover { transform: translateY(-1px) scale(1.07); box-shadow: 0 7px 18px rgba(123,104,238,.55); }
  .suggest-btn:active { transform: scale(.92); }
  .del-opt {
    flex: none; width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer;
    background: rgba(232,93,117,.1); color: var(--pink); font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .del-opt:hover { background: rgba(232,93,117,.24); transform: translateY(-1px) scale(1.07); }
  .del-opt:active { transform: scale(.92); }
  .label-pro { font-size: 12px; color: var(--accent2); margin-bottom: 6px; font-weight: 700; letter-spacing: .06em; }
  .label-con { font-size: 12px; color: var(--pink); margin-bottom: 6px; font-weight: 700; letter-spacing: .06em; }
  .list-row { display: flex; gap: 4px; margin-bottom: 4px; }
  .list-row input { font-size: 13px !important; padding: 7px 10px; }
  .list-row button {
    padding: 4px 10px; border-radius: 8px; border: none;
    background: rgba(232,93,117,.12); color: var(--pink); cursor: pointer; font-size: 13px; transition: background .15s;
  }
  .list-row button:hover { background: rgba(232,93,117,.25); }
  .add-btn, .btn-add-opt {
    padding: 6px 14px; border-radius: 9px; border: 1px dashed #4a4a78;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; transition: all .18s;
  }
  .add-btn:hover, .btn-add-opt:hover { color: var(--text); border-color: var(--accent); background: rgba(123,104,238,.1); }
  .score { margin-top: 12px; text-align: center; font-size: 22px; font-weight: 800; }
  .weigh-actions { display: flex; gap: 10px; justify-content: center; }
  .btn-weigh, .btn-shuffle {
    padding: 12px 32px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--gold2), var(--gold) 55%, #f0b545);
    color: #231a02; font-weight: 800; cursor: pointer; font-size: 15.5px;
    box-shadow: 0 8px 22px rgba(232,197,71,.32), inset 0 1px 0 rgba(255,255,255,.5);
    transition: all .2s;
  }
  .btn-weigh:hover, .btn-shuffle:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(232,197,71,.45); }
  .btn-weigh:active, .btn-shuffle:active:not(:disabled) { transform: translateY(0); }
  .btn-shuffle:disabled { background: #2a2a50; color: var(--muted); cursor: wait; box-shadow: none; }
  .weigh-result {
    text-align: center; font-size: 24px; font-weight: 800;
    background: linear-gradient(120deg, var(--gold2), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 16px rgba(232,197,71,.3));
    animation: fadeUp .4s ease;
  }
  .weigh-tie { text-align: center; font-size: 18px; color: var(--muted); }

  /* Shuffle */
  .cat-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .cat-btn {
    padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-weight: 600; cursor: pointer;
    font-size: 14px; transition: all .2s;
  }
  .cat-btn:hover { color: var(--text); border-color: #4a4a7e; transform: translateY(-1px); }
  .cat-btn.active {
    background: linear-gradient(135deg, var(--accent), #5b4bd6);
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 16px rgba(123,104,238,.35);
  }
  .shuffle-display { min-height: 120px; display: flex; align-items: center; justify-content: center; }
  .shuffle-pick {
    font-size: 38px; font-weight: 800; text-align: center; letter-spacing: .01em;
    transition: all .3s; text-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  .shuffle-pick.flash { color: var(--gold2); text-shadow: 0 0 24px rgba(232,197,71,.75), 0 4px 12px rgba(0,0,0,.4); }
  .shuffle-empty { color: var(--muted); font-size: 16px; }

  /* Records */
  .record-bar { display: flex; gap: 8px; width: 100%; max-width: 560px; margin: 22px auto 0; padding: 0 24px; }
  .record-bar button {
    padding: 10px 16px; border-radius: 11px; border: 1px solid var(--border); cursor: pointer;
    font-size: 13px; font-weight: 600; background: var(--surface); color: var(--text);
    transition: all .18s;
  }
  .record-bar button:hover { border-color: #4a4a7e; transform: translateY(-1px); }
  .record-bar #record-save {
    background: linear-gradient(135deg, var(--accent), #5b4bd6); color: #fff; border-color: transparent;
    box-shadow: 0 5px 14px rgba(123,104,238,.3);
  }
  .record-msg { max-width: 560px; margin: 8px auto 0; padding: 0 24px; font-size: 13px; }
  .record-msg.ok { color: #5fe0a8; }
  .record-msg.err { color: var(--pink); }
  .record-box {
    max-width: 560px; margin: 14px auto 0; padding: 14px 16px 16px;
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0,0,0,.35);
    animation: fadeUp .3s ease;
  }
  .record-box-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .record-box-head button {
    padding: 5px 12px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #5b4bd6); color: #fff;
    box-shadow: 0 4px 10px rgba(123,104,238,.3); transition: all .15s;
  }
  .record-box-head button:hover { transform: translateY(-1px); }
  .record-box-head #record-close { background: var(--input); color: var(--muted); margin-left: auto; box-shadow: none; }
  .record-code {
    margin-top: 10px; font-family: Consolas, Menlo, monospace; font-size: 13px;
    color: var(--gold); word-break: break-all; line-height: 1.6;
    background: rgba(10,10,24,.6); border: 1px solid #2c2c52;
    padding: 12px; border-radius: 10px; user-select: all;
  }
  .record-hist { max-width: 560px; margin: 18px auto 0; padding: 0 24px; }
  .record-hist-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .record-hist-head #record-count { color: var(--gold); }
  .record-hist-head #record-clear {
    margin-left: auto; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; font-size: 11px; background: transparent; color: var(--muted); transition: all .15s;
  }
  .record-hist-head #record-clear:hover { color: var(--pink); border-color: var(--pink); }
  .record-item {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; margin-bottom: 7px;
    transition: border-color .15s;
  }
  .record-item:hover { border-color: #4a4a7e; }
  .record-meta { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; min-width: 130px; }
  .record-code-sm { font-size: 11px; color: #8f8fb8; word-break: break-all; }
  .record-acts { margin-left: auto; display: flex; gap: 6px; }
  .record-acts button {
    padding: 4px 11px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer;
    font-size: 12px; background: transparent; color: var(--accent2); transition: all .15s;
  }
  .record-acts button:hover { border-color: var(--accent); background: rgba(123,104,238,.12); }
  .record-acts button:last-child { color: var(--pink); }
  .record-acts button:last-child:hover { border-color: var(--pink); background: rgba(232,93,117,.1); }

  /* Versus */
  .vs-empty { color: var(--muted); font-size: 15px; text-align: center; padding: 24px 0; }
  .vs-round { text-align: center; color: var(--muted); font-size: 14px; }
  .vs-hint { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .vs-bye { text-align: center; color: var(--gold); font-size: 14px; padding: 6px 0 2px; text-shadow: 0 0 18px rgba(232,197,71,.4); }
  .vs-duel { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
  .vs-card {
    padding: 26px 18px; border-radius: 16px; border: 1.5px solid var(--border);
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    color: var(--text); font-size: 21px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,.3);
    transition: all .2s;
  }
  .vs-card:hover, .vs-card:active {
    border-color: var(--accent);
    background: linear-gradient(180deg, #2e2e5e, #282852);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(123,104,238,.3), 0 0 0 1px rgba(123,104,238,.5);
  }
  .vs-card:active { transform: translateY(0) scale(.985); }
  .vs-win {
    font-size: 38px; font-weight: 800; text-align: center;
    background: linear-gradient(120deg, var(--gold2), var(--gold) 55%, #ffb84d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(232,197,71,.4));
    animation: fadeUp .4s ease;
  }
  .vs-sub { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* Score */
  .score-table-wrap { width: 100%; max-width: 640px; overflow-x: auto; padding-bottom: 4px; }
  .score-table { border-collapse: separate; border-spacing: 7px; width: 100%; min-width: 400px; }
  .score-table th, .score-table td {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border-radius: 12px; padding: 9px; text-align: center; vertical-align: middle;
  }
  .score-table input.num { width: 48px; }
  .score-crit-cell { display: flex; flex-direction: column; gap: 6px; min-width: 84px; }
  .score-crit-meta { display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .score-crit-meta button, .score-del-opt {
    background: rgba(232,93,117,.12); color: var(--pink);
    border: none; border-radius: 7px; cursor: pointer; padding: 2px 9px; font-size: 13px; transition: background .15s;
  }
  .score-crit-meta button:hover, .score-del-opt:hover { background: rgba(232,93,117,.25); }
  .opt-cell { display: flex; align-items: center; gap: 6px; min-width: 96px; }
  .score-tot { font-size: 19px; font-weight: 800; color: var(--muted); }
  .score-tot.low { color: var(--muted); }
  .score-table tr.winner-row td {
    outline: 1.5px solid var(--gold); outline-offset: -1.5px;
    background: linear-gradient(180deg, rgba(232,197,71,.10), rgba(232,197,71,.04));
  }
  .score-table tr.winner-row .score-tot {
    background: linear-gradient(120deg, var(--gold2), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #score-result { min-height: 32px; text-align: center; font-size: 21px; font-weight: 800; }
  .score-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* Fate */
  .fate-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .fate-dice { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .fate-dice { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; perspective: 800px; min-height: 96px; align-items: center; }
  .die-slot { width: 78px; height: 78px; transform-style: preserve-3d; }
  .die-cube { position: relative; width: 78px; height: 78px; transform-style: preserve-3d; }
  .die-face {
    position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(150deg, #fffdf4, #e8e3d4);
    border: 3px solid #191713;
    box-shadow: inset 0 -4px 8px rgba(40,34,20,.22), inset 0 2px 3px rgba(255,255,255,.9);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 11px; backface-visibility: hidden;
  }
  .die-face.f1 { transform: translateZ(39px); }
  .die-face.f2 { transform: rotateX(90deg) translateZ(39px); }

<body>
<div class="header">
  <h1><span id="title-txt" data-i18n="title">帮你选</span></h1>
  <p id="sub-txt" data-i18n="sub">选择困难？交给我</p>
  <button class="lang-btn" id="lang-btn">🌐 EN</button>
</div>
<nav class="tabs">
  <button class="tab active" data-tab="spin">🎡 转盘</button>
  <button class="tab" data-tab="weigh">⚖️ 权衡</button>
  <button class="tab" data-tab="shuffle">🎲 随机</button>
  <button class="tab" data-tab="fate">🧧 命运</button>
</nav>
<!-- RECORDS -->
<div class="record-bar">
  <input id="record-input" data-i18n-ph="rec_in_ph" placeholder="输入记录码，导入此前的数据" spellcheck="false" />
  <button id="record-load" data-i18n="rec_load">导入</button>
  <button id="record-save" data-i18n="rec_save">生成记录码</button>
</div>
<div id="record-msg" class="record-msg"></div>
<div id="record-box" class="record-box" hidden>
  <div class="record-box-head"><span data-i18n="rec_box_head">本次记录码（已自动存入历史）</span><button id="record-copy" data-i18n="rec_copy">复制</button><button id="record-close">×</button></div>
  <div id="record-code" class="record-code"></div>
</div>
<div class="record-hist" id="record-hist" hidden>
  <div class="record-hist-head"><span data-i18n="rec_hist">历史记录</span><span id="record-count"></span><button id="record-clear" data-i18n="rec_clear">清空</button></div>
  <div id="record-list"></div>
</div>
<main class="main">
  <!-- SPIN -->
  <div class="mode active" id="spin-mode">
    <div class="deck-tabs" id="deck-tabs"></div>
    <div class="deck-ops">
      <button class="add-btn" id="deck-rename" data-i18n="deck_rename">重命名</button>
      <button class="add-btn" id="deck-del" data-i18n="deck_delete">删除</button>
    </div>
    <div class="wheel-wrap">
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    <div id="spin-result"></div>
    <div class="input-row">
      <input id="spin-input" data-i18n-ph="spin_ph" placeholder="添加选项..." />
      <button id="spin-add">+</button>
    </div>
    <div class="chips" id="spin-chips"></div>
  </div>
  <!-- WEIGH -->
  <div class="mode weigh" id="weigh-mode">
    <input class="weigh-q" id="weigh-q" data-i18n-ph="weigh_q_ph" placeholder="你在纠结什么？" />
    <div class="suggest-hint" id="suggest-hint" data-i18n="suggest_tip"></div>
    <div class="weigh-import">
      <select id="import-deck"></select>
      <button class="add-btn" id="import-from-wheel" data-i18n="weigh_import">导入转盘选项</button>
    </div>
    <div class="cards" id="weigh-cards"></div>
    <div class="score-zone">
      <div class="vs-head"><span data-i18n="score_zone">📊 多维度打分</span><button class="add-btn" id="score-add-crit" data-i18n="score_add_crit">+ 添加评分标准</button></div>
      <div class="score-table-wrap" id="score-table-wrap"></div>
      <div id="score-result"></div>
    </div>
    <div class="weigh-actions">
      <button class="btn-add-opt" id="weigh-add-opt" data-i18n="weigh_add">添加选项</button>
      <button class="btn-weigh" id="weigh-btn" data-i18n="weigh_start">开始权衡</button>
    </div>
    <div id="weigh-result"></div>
  </div>
  <!-- SHUFFLE -->
  <div class="mode" id="shuffle-mode">
    <div class="cat-btns" id="cat-btns"></div>
    <div class="input-row">
      <input id="custom-input" placeholder="往当前分类加个选项..." />
      <button id="custom-add">+</button>
    </div>
    <div class="chips" id="custom-chips"></div>
    <button class="add-btn" id="custom-reset" data-i18n="custom_reset" hidden>清空当前分类的自定义项</button>
    <div class="pool-toggle-row">
      <button class="add-btn" id="pool-toggle" data-i18n="pool_toggle">查看全部选项</button>
    </div>
    <div class="pool-panel" id="pool-panel" hidden>
      <div class="chips" id="pool-chips"></div>
      <div class="weigh-actions">
        <button class="btn-add-opt" id="pool-to-wheel" data-i18n="pool_import">全部导入当前转盘</button>
      </div>
      <div class="pool-status" id="pool-status"></div>
    </div>
    <div class="shuffle-display" id="shuffle-display">
      <div class="shuffle-empty" data-i18n="shuffle_q_eat">今天吃什么？</div>
    </div>
    <button class="btn-shuffle" id="shuffle-btn" data-i18n="shuffle_btn">随机一下</button>
    <div class="vs-head" data-i18n="vs_head">🏆 淘汰赛 PK</div>
    <div class="weigh-actions">
      <button class="cat-btn" id="vs-size">抽 8 个</button>
      <button class="btn-weigh" id="vs-auto" data-i18n="vs_auto">随机抽几个来 PK</button>
    </div>
    <div class="input-row">
      <input id="vs-input" data-i18n-ph="vs_ph" placeholder="或手动加参赛项..." />
      <button id="vs-add">+</button>
    </div>
    <div class="chips" id="vs-chips"></div>
    <div id="vs-stage" style="display:none"></div>
    <div class="vs-empty" id="vs-empty">从当前分类里抽几个，两两 PK 选冠军</div>
    <div class="weigh-actions" id="vs-actions">
      <button class="btn-weigh" id="vs-start" data-i18n="vs_start">开始 PK</button>
      <button class="btn-add-opt" id="vs-clear" data-i18n="vs_clear">清空</button>
    </div>
  </div>
  <!-- FATE -->
  <div class="mode" id="fate-mode">
    <div class="cat-btns" id="fate-btns">
      <button class="cat-btn active" data-fate="dice">🎲 骰子</button>
      <button class="cat-btn" data-fate="yesno">🌸 是非</button>
      <button class="cat-btn" data-fate="fortune">🧧 签语</button>
    </div>
    <div class="shuffle-display" id="fate-display">
      <div class="shuffle-empty">点「掷骰子」</div>
    </div>
    <div class="fate-opts" id="fate-opts">
      <label><span data-i18n="fate_count">骰子数量</span> <input id="fate-count" type="number" min="1" max="3" value="1" /></label>
    </div>
    <button class="btn-shuffle" id="fate-btn" data-i18n="fate_roll">掷骰子</button>
  </div>
</main>

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const WHEEL_SIZE = 320;
(function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = WHEEL_SIZE * dpr;
  canvas.height = WHEEL_SIZE * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

function drawWheel(angle) {
  const size = WHEEL_SIZE, cx = size/2, cy = size/2, r = size/2 - 8;
  ctx.clearRect(0, 0, size, size);
  const opts = wheelItems.length ? wheelItems : (LANG === 'en' ? ["Add","some","options"] : ["添加","一些","选项"]);
  const slice = (2 * Math.PI) / opts.length;
  opts.forEach((opt, i) => {
    const start = angle + i * slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + slice);
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.font = `600 ${Math.max(12, 17 - opts.length * 0.55)}px system-ui, 'Microsoft YaHei', 'Noto Sans SC', sans-serif`;
    const label = opt.length > 12 ? opt.slice(0, 11) + "…" : opt;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(26,26,46,0.55)";
    ctx.strokeText(label, r - 16, 5);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, r - 16, 5);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
  ctx.fillStyle = COLORS.bg;
  ctx.fill();
  // steel pins the flipper kicks off
  for (let i = 0; i < opts.length; i++) {
    const pa = angle + i * slice;
    const px = cx + Math.cos(pa) * (r - 9);
    const py = cy + Math.sin(pa) * (r - 9);
    ctx.beginPath(); ctx.arc(px, py, 3.8, 0, 2*Math.PI); ctx.fillStyle = "rgba(6,6,16,.6)"; ctx.fill();
    const pg = ctx.createRadialGradient(px - 1, py - 1.3, 0.4, px, py, 3.4);
    pg.addColorStop(0, "#ffffff");
    pg.addColorStop(.55, "#c7c7e8");
    pg.addColorStop(1, "#5c5c86");
    ctx.beginPath(); ctx.arc(px, py, 3.1, 0, 2*Math.PI); ctx.fillStyle = pg; ctx.fill();
  }
  // short triangular pointer, knocked aside by the pins
  ctx.save();
  ctx.translate(cx, cy - r + 6);
  ctx.rotate(pointerAngle);
  const TW = 15, TH = 40;
  ctx.shadowColor = "rgba(232,197,71,.6)";
  ctx.shadowBlur = 12 + Math.min(18, Math.abs(pointerVel) * 22);
  const tg = ctx.createLinearGradient(-TW, 0, TW, 0);
  tg.addColorStop(0, "#b8880f");
  tg.addColorStop(.35, "#FFD54F");
  tg.addColorStop(.55, "#FFF3C4");
  tg.addColorStop(1, "#c08f12");
  ctx.beginPath();
  ctx.moveTo(-TW, 0); ctx.lineTo(TW, 0); ctx.lineTo(0, TH); ctx.closePath();
  ctx.fillStyle = tg;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(20,16,4,.55)";
  ctx.lineWidth = 2;
  ctx.stroke();
  // pivot cap
  ctx.fillStyle = "#1c1c36";
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, 2*Math.PI); ctx.fill();
  const rv = ctx.createRadialGradient(-2, -2.5, 0.5, 0, 0, 6.5);
  rv.addColorStop(0, "#f6f6ff");
  rv.addColorStop(.6, "#9a9ac0");
  rv.addColorStop(1, "#3c3c62");
  ctx.beginPath(); ctx.arc(0, 0, 6.2, 0, 2*Math.PI); ctx.fillStyle = rv; ctx.fill();
  ctx.fillStyle = "#2a2a4c";
  ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, 2*Math.PI); ctx.fill();
  ctx.restore();
}

const WHEEL_R = WHEEL_SIZE / 2 - 8;
const PEG_R = WHEEL_R - 9;
const PIVOT_Y = WHEEL_CY - WHEEL_R + 6;
const ARM_LEN = WHEEL_R - 58;
function signedDiff(a) { return ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; }
function updatePointer(now, moving) {
  const dt = lastFrame ? Math.min(2.5, Math.max(0.2, (now - lastFrame) / 16.67)) : 1;
  lastFrame = now;
  // wheel angular speed (rad/frame): as the wheel crawls to a stop the pins stop pushing
  const speed = prevWheelAngle == null ? 0 : Math.abs(wheelAngle - prevWheelAngle) / dt;
  prevWheelAngle = wheelAngle;
  const n = wheelItems.length || 3;
  const slice = (2 * Math.PI) / n;
  const pushWindow = speed > 0.05 ? 0.45 : Math.max(0, 0.45 * (speed - 0.006) / 0.044);
  let contact = null;
  if (moving && pushWindow > 0.02) {
    // find a rim pin close to the pointer's tip in the upper half of the wheel
    for (let i = 0; i < n; i++) {
      const a = wheelAngle + i * slice;
      if (Math.sin(a) < -0.3) {
        const th = Math.atan2(PEG_R * Math.cos(a), WHEEL_CY + PEG_R * Math.sin(a) - PIVOT_Y);
        const d = Math.abs(signedDiff(th - pointerAngle));
        if (d < pushWindow && (contact === null || d < contact.d)) contact = { th, d };
      }
    }
  }
  if (contact) {
    // pushed by a peg: the arm tip rides the peg kinematically, keep its sweep speed
    if (prevPegAngle != null) {
      pointerVel = (contact.th - prevPegAngle) / dt;
      pointerVel = Math.max(-0.75, Math.min(0.75, pointerVel));
    }
    pointerAngle = contact.th;
    prevPegAngle = contact.th;
  } else {
    // free: rubber flipper — kicks off the pin, then a fast damped wobble
    if (prevPegAngle != null) pointerVel = Math.max(-1.1, Math.min(1.1, pointerVel * 1.35));
    pointerVel += (-pointerAngle) * 0.55 * dt - pointerVel * 0.24 * dt;
    pointerAngle += pointerVel * dt;
    prevPegAngle = null;
    if (!moving && Math.abs(pointerVel) < 0.008 && Math.abs(pointerAngle) < 0.012) {
      pointerAngle = 0; pointerVel = 0;
    }
  }
  if (pointerAngle > 0.95) { pointerAngle = 0.95; if (pointerVel > 0) pointerVel = 0; }
  if (pointerAngle < -0.95) { pointerAngle = -0.95; if (pointerVel < 0) pointerVel = 0; }
}

function spin() {
  if (spinning || wheelItems.length < 2) return;
  spinning = true;
  document.getElementById('spin-result').innerHTML = '';
  const totalRotation = Math.PI * 2 * (5 + Math.random() * 5);
  const startAngle = wheelAngle;
  const duration = 4800;
  const startTime = performance.now();
  lastFrame = 0;
  prevWheelAngle = null;
  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 5);
    wheelAngle = startAngle + totalRotation * ease;
    updatePointer(now, t < 1);
    drawWheel(wheelAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else if (Math.abs(pointerAngle) > 0.012 || Math.abs(pointerVel) > 0.01) {
      requestAnimationFrame(animate);
    } else {
      const slice = (2 * Math.PI) / wheelItems.length;
      // 指针复位在正上方（画布角度 3π/2），计算指针此刻所指的扇区
      const ptr = (3 * Math.PI / 2 - (wheelAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const idx = Math.floor(ptr / slice) % wheelItems.length;
      document.getElementById('spin-result').innerHTML = `<div class="result">${wheelItems[idx]}</div>`;
      spinning = false;
      lastFrame = 0;
    }
  }
  requestAnimationFrame(animate);
}

}

function locPhrase(s) { return LANG === 'en' ? (PHR[s] != null ? PHR[s] : s) : s; }
function locPhrases(arr) { return (arr || []).map(locPhrase); }
function matchSuggest(name) {
  const nl = name.toLowerCase();
  // 1) 具体词条：取命中的最长关键词（更精确），大小写不敏感
  let best = null;
  for (const k in SUGGEST) {
    const kl = k.toLowerCase();
    if (nl.includes(kl) || kl.includes(nl) || name.includes(k) || k.includes(name)) {
      if (!best || k.length > best.k.length) best = { k, s: SUGGEST[k] };
    }
  }
  if (best) return { pros: locPhrases(best.s.pros), cons: locPhrases(best.s.cons), what: best.k };
  // 2) 语义类别兜底
  for (const c of CATEGORIES) if (c.re.test(name)) return { pros: locPhrases(c.sug.pros), cons: locPhrases(c.sug.cons), cat: c.key };
  return null;
}
/* 同步打分表中显示的选项名 */
function syncScoreNames() {
  document.querySelectorAll('[data-name-i]').forEach(el => {
    const k = +el.dataset.nameI;
    const o = weighOptions[k];
    el.textContent = o ? (o.name.trim() || t('opt_n', k + 1)) : '';
  });
}
/* 恢复提示条为默认提示 */
function resetSuggestHint() {
  const el = document.getElementById('suggest-hint');
  if (el) { el.textContent = t('suggest_tip'); el.classList.remove('warn'); }
}
/* 未填选项名时按了识别键：抖动输入框并提示 */
function showNeedName(i) {
  const input = document.querySelector('.opt-name[data-i="' + i + '"]');
  if (input) {
    input.classList.add('shake');
    setTimeout(() => { if (input.classList) input.classList.remove('shake'); }, 400);
    if (input.focus) input.focus();
  }
  const el = document.getElementById('suggest-hint');
  if (el) { el.textContent = t('suggest_need'); el.classList.add('warn'); }
}
/* 按 ✨ 键或回车主动识别并填入优缺点（不再输入时自动识别） */
function recommendFor(i) {
  const o = weighOptions[i];
  if (!o) return;
  const name = (o.name || '').trim();
  if (!name) { showNeedName(i); return; }
  const sug = matchSuggest(name) || { pros: locPhrases(DEFAULT_SUGGEST.pros), cons: locPhrases(DEFAULT_SUGGEST.cons), cat: 'general' };
  o.pros = sug.pros.slice();
  o.cons = sug.cons.slice();
  o.manual = false;
  showWeighResult = false;
  document.getElementById('weigh-result').innerHTML = '';
  showSuggestHint(name, sug.what || t('tag_' + sug.cat), sug.pros.length, sug.cons.length);
  renderWeigh();
  // 保持焦点留在名称输入框，方便连续调整
  const input = document.querySelector('.opt-name[data-i="' + i + '"]');
  if (input && input.focus) {
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  }
}
/* 语言切换时：仅重新本地化通过 ✨ 识别生成的优缺点（手动编写的保留） */
function relocSuggestions() {
  weighOptions.forEach(o => {
    if (!o || o.manual !== false || !o.name || !o.name.trim()) return;
    const name = o.name.trim();
    const sug = matchSuggest(name) || { pros: locPhrases(DEFAULT_SUGGEST.pros), cons: locPhrases(DEFAULT_SUGGEST.cons), cat: 'general' };
    o.pros = sug.pros.slice();
    o.cons = sug.cons.slice();
    o.manual = false;
    showSuggestHint(name, sug.what || t('tag_' + sug.cat), sug.pros.length, sug.cons.length);
  });
}
function showSuggestHint(name, tag, pn, cn) {
  const el = document.getElementById('suggest-hint');
  if (!el) return;
  el.innerHTML = `${t('suggest_prefix')}<b>${esc(name)}</b> ${t('suggest_mid')} <b>${esc(tag)}</b> → ${t('suggest_auto', pn, cn)}${t('suggest_suffix')}`;
}

function renderWeigh() {
  const container = document.getElementById('weigh-cards');
  container.className = 'cards' + (weighOptions.length === 3 ? ' three' : weighOptions.length === 4 ? ' four' : weighOptions.length >= 5 ? ' six' : '');
  if (!weighOptions.length) {
    container.innerHTML = `<div class="weigh-empty">${t('weigh_empty')}</div>`;
    document.getElementById('weigh-add-opt').style.display = '';

  const scores = weighOptions.map(o => o.pros.filter(x => x.trim()).length - o.cons.filter(x => x.trim()).length);
  const maxScore = Math.max(...scores);
  const uniqueMax = scores.filter(s => s === maxScore).length === 1;

      ${opt.pros.map((p, j) => `<div class="list-row"><input data-i="${i}" data-j="${j}" data-field="pros" placeholder="${t('pro_ph')}" value="${esc(p)}" /><button data-i="${i}" data-j="${j}" data-field="pros">x</button></div>`).join('')}
      <button class="add-btn" data-i="${i}" data-field="pros">${t('add_pro')}</button>
      <div class="label-con">${t('label_con')}</div>
      ${opt.cons.map((c, j) => `<div class="list-row"><input data-i="${i}" data-j="${j}" data-field="cons" placeholder="${t('con_ph')}" value="${esc(c)}" /><button data-i="${i}" data-j="${j}" data-field="cons">x</button></div>`).join('')}
      <button class="add-btn" data-i="${i}" data-field="cons">${t('add_con')}</button>
      ${showWeighResult ? `<div class="score" style="color:${winner===i?COLORS.gold:COLORS.muted}">${scores[i]>0?'+':''}${scores[i]}</div>` : ''}
    </div>
  `).join('');

  // bind events
  container.querySelectorAll('.opt-name').forEach(el => {
    const i = +el.dataset.i;
    el.addEventListener('input', () => {
      const o = weighOptions[i];
      if (o) { o.name = el.value; }
      showWeighResult = false;
      document.getElementById('weigh-result').innerHTML = '';
      syncScoreNames();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); recommendFor(i); } });
    el.addEventListener('blur', () => {
      if (!el.isConnected) return;
      const o = weighOptions[i];
      if (!o) return;
      // 删掉项目名后：如果是自动推荐的优缺点，也一并删除
      if (!o.name.trim() && !o.manual && (o.pros.some(x => x.trim()) || o.cons.some(x => x.trim()))) {
        o.pros = [""]; o.cons = [""];
        resetSuggestHint();
        renderWeigh();
      }
    });
  });
  container.querySelectorAll('.suggest-btn').forEach(el => {
    el.addEventListener('click', () => recommendFor(+el.dataset.suggestI));
  });
  container.querySelectorAll('.del-opt').forEach(el => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); });
    el.addEventListener('click', () => {
      weighOptions.splice(+el.dataset.delI, 1);
      showWeighResult = false;
      document.getElementById('weigh-result').innerHTML = '';
      resetSuggestHint();
      renderWeigh();
    });
  });
  container.querySelectorAll('.list-row input').forEach(el => {
    el.addEventListener('input', () => { weighOptions[+el.dataset.i][el.dataset.field][+el.dataset.j] = el.value; weighOptions[+el.dataset.i].manual = true; showWeighResult = false; document.getElementById('weigh-result').innerHTML = ''; });
  });
  container.querySelectorAll('.list-row button').forEach(el => {
    el.addEventListener('click', () => {
      const list = weighOptions[+el.dataset.i][el.dataset.field];
      list.splice(+el.dataset.j, 1);
      if (!list.length) list.push("");
      weighOptions[+el.dataset.i].manual = true;
      showWeighResult = false;
      renderWeigh();
    });
  });
  container.querySelectorAll('.add-btn').forEach(el => {
    el.addEventListener('click', () => { weighOptions[+el.dataset.i][el.dataset.field].push(""); weighOptions[+el.dataset.i].manual = true; renderWeigh(); });
  });

  document.getElementById('weigh-add-opt').style.display = weighOptions.length >= 6 ? 'none' : '';

  const resultEl = document.getElementById('weigh-result');
  if (showWeighResult && winner >= 0) {
    const nm = weighOptions[winner].name.trim() || t('opt_n', winner+1);
    resultEl.innerHTML = `<div class="weigh-result">${esc(nm)} ${t('weigh_win_suffix')}</div>`;
  } else if (showWeighResult) {
    resultEl.innerHTML = `<div class="weigh-tie">${t('weigh_tie')}</div>`;
  } else {
    resultEl.innerHTML = '';
  }

  renderScoreTable();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function c15(v) { v = parseInt(v, 10); if (isNaN(v)) return 3; return Math.min(5, Math.max(1, v)); }
function scoreTotals() {
  return weighOptions.map(o => scoreCrits.reduce((s, c, j) => s + c15(o.scores[j]) * c15(c.w), 0));
}
function updateScoreResult() {
  const totals = scoreTotals();
  const maxV = Math.max(...totals);
  const unique = totals.filter(t => t === maxV).length === 1;
  const win = unique ? totals.indexOf(maxV) : -1;
  document.querySelectorAll('[data-total]').forEach(el => {
    const i = +el.dataset.total;
    el.textContent = totals[i];
    el.className = 'score-tot' + (i === win ? '' : ' low');
  });
  const res = document.getElementById('score-result');
  if (win >= 0 && weighOptions.length) {
    const nm = weighOptions[win].name.trim();
    res.innerHTML = `🏆 ${esc(nm || t('opt_n', win + 1))} ${t('score_lead', maxV)}`;
    res.style.color = COLORS.gold;
  } else {
    res.textContent = t('score_hint');
    res.style.color = COLORS.muted;
  }
}
function renderScoreTable() {
  weighOptions.forEach(o => { if (!Array.isArray(o.scores)) o.scores = []; while (o.scores.length < scoreCrits.length) o.scores.push(3); o.scores.length = scoreCrits.length; });
  const wrap = document.getElementById('score-table-wrap');
  wrap.innerHTML = `
  <table class="score-table" id="score-table">
    <thead><tr>
      <th>${t('opt_col')}</th>
      ${scoreCrits.map((c, i) => `<th><div class="score-crit-cell">
        <input data-k="crit-name" data-i="${i}" placeholder="${t('crit_n', i + 1)}" value="${esc(c.name)}" />
        <div class="score-crit-meta">${t('weight')}<input class="num" type="number" min="1" max="5" data-k="crit-w" data-i="${i}" value="${c.w}" /><button data-k="crit-del" data-i="${i}" ${scoreCrits.length <= 1 ? 'disabled' : ''}>×</button></div>
      </div></th>`).join('')}
      <th>${t('total')}</th>
    </tr></thead>
    <tbody>
      ${weighOptions.map((o, i) => `<tr data-row="${i}">
        <td><div class="opt-cell"><span class="score-opt-name" data-name-i="${i}">${esc(o.name.trim() || t('opt_n', i + 1))}</span></div></td>
        ${o.scores.map((s, j) => `<td><input class="num" type="number" min="1" max="5" data-k="score" data-i="${i}" data-j="${j}" value="${s}" /></td>`).join('')}
        <td><div class="score-tot low" data-total="${i}">0</div></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
  wrap.querySelectorAll('input').forEach(el => {
    const k = el.dataset.k, i = +el.dataset.i;
    const apply = () => {
      if (k === 'crit-name') scoreCrits[i].name = el.value;
      else if (k === 'score') { const v = parseInt(el.value, 10); if (!isNaN(v)) weighOptions[i].scores[+el.dataset.j] = c15(v); }
      else if (k === 'crit-w') { const v = parseInt(el.value, 10); if (!isNaN(v)) scoreCrits[i].w = c15(v); }
      updateScoreResult();
    };
    el.addEventListener('input', apply);
    el.addEventListener('blur', () => {
      if (k === 'score') { weighOptions[i].scores[+el.dataset.j] = c15(el.value); el.value = weighOptions[i].scores[+el.dataset.j]; }
      if (k === 'crit-w') { scoreCrits[i].w = c15(el.value); el.value = scoreCrits[i].w; }
    });
  });
  wrap.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.k, i = +btn.dataset.i;
    if (k === 'crit-del' && scoreCrits.length > 1) { scoreCrits.splice(i, 1); renderScoreTable(); }
  }));
  updateScoreResult();
}

document.getElementById('weigh-add-opt').addEventListener('click', () => {
  if (weighOptions.length < 6) { weighOptions.push({ name:"", pros:[""], cons:[""], scores: scoreCrits.map(() => 3) }); showWeighResult = false; renderWeigh(); }
});
document.getElementById('weigh-btn').addEventListener('click', () => { showWeighResult = true; renderWeigh(); });
document.getElementById('score-add-crit').addEventListener('click', () => {

function renderDeckSelect() {

document.getElementById('import-from-wheel').addEventListener('click', () => {

/* ---- SHUFFLE ---- */
let shuffleCat = "eat";
let shuffling = false;
const catKeys = ["eat", "watch", "do", "wear"];
const catQs = { eat:"shuffle_q_eat", watch:"shuffle_q_watch", do:"shuffle_q_do", wear:"shuffle_q_wear" };
let customDaily = { eat:[], watch:[], do:[], wear:[] };
function catCount(k) { return DAILY[k].length + customDaily[k].length; }
function poolFor(k) { return DAILY[k].concat(customDaily[k]); }

function renderCats() {

function setShuffleHint() {

function updatePoolToggle() {

document.getElementById('shuffle-btn').addEventListener('click', () => {

/* ---- FATE (骰子 / 是非 / 签语) ---- */
function fateList(kind) { return (LANG === 'en' ? (kind === 'yesno' ? YESNO.en : FORTUNE.en) : (kind === 'yesno' ? YESNO.zh : FORTUNE.zh)); }
let fateMode = "dice";
let fateCount = 1;
let fateRolling = false;
function newRoll() { return Array.from({ length: fateCount }, () => 1 + Math.floor(Math.random() * 6)); }
const PIPS = {
  1: [[1,1]], 2: [[0,0],[2,2]], 3: [[0,0],[1,1],[2,2]],
  4: [[0,0],[0,2],[2,0],[2,2]], 5: [[0,0],[0,2],[1,1],[2,0],[2,2]],
  6: [[0,0],[0,2],[1,0],[1,2],[2,0],[2,2]]
};
function faceRot(d) {
  return {
    1: 'rotateX(0deg) rotateY(0deg)', 2: 'rotateX(-90deg) rotateY(0deg)',
    3: 'rotateY(-90deg)', 4: 'rotateY(90deg)', 5: 'rotateX(90deg)', 6: 'rotateY(180deg)'
  }[d];
}
function facePipsHtml(d) {
  return PIPS[d].map(p => `<i class="pip" style="grid-area:${p[1]+1}/${p[0]+1}"></i>`).join('');
}
function buildDice(count) {
  let slots = '';
  for (let i = 0; i < count; i++) {
    let faces = '';
    for (let d = 1; d <= 6; d++) faces += `<div class="die-face f${d}">${facePipsHtml(d)}</div>`;
    slots += `<div class="die-slot"><div class="die-cube">${faces}</div></div>`;
  }
  return `<div class="fate-wrap"><div class="fate-dice">${slots}</div><div class="fate-total">${LANG === 'en' ? 'Total —' : '总点数 —'}</div></div>`;
}
function startDiceTumble(disp) {
  if (!disp || !disp.querySelectorAll) return;
  const cubes = disp.querySelectorAll('.die-cube');
  for (let i = 0; i < cubes.length; i++) {
    const cube = cubes[i];
    if (!cube || !cube.animate) continue;
    cube.animate([
      { transform: 'rotateX(0deg) rotateY(0deg) rotateZ(0deg)' },
      { transform: 'rotateX(540deg) rotateY(720deg) rotateZ(180deg)' }
    ], { duration: 1100 + i * 120, iterations: Infinity, easing: 'linear' });
  }
}
function landDice(disp, results) {
  if (!disp || !disp.querySelectorAll) return;
  const slots = disp.querySelectorAll('.die-slot');
  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    if (!slot) continue;
    const cube = slot.querySelector('.die-cube');
    const d = results[i] || 1;
    const target = `rotateX(-12deg) rotateY(20deg) ${faceRot(d)}`;
    let from = 'rotateX(0deg) rotateY(0deg)';
    try {
      const cs = typeof getComputedStyle === 'function' ? getComputedStyle(cube).transform : '';
      if (cs && cs !== 'none') from = cs;
    } catch (e) {}
    if (cube && cube.getAnimations) cube.getAnimations().forEach(a => a.cancel());
    if (cube && cube.animate) {
      cube.animate([{ transform: from }, { transform: target }], {
        duration: 760, delay: i * 90, easing: 'cubic-bezier(.2,.9,.25,1.22)', fill: 'forwards'
      });
    } else if (cube) cube.style.transform = target;
    if (slot.animate) {
      slot.animate([
        { transform: 'scale(1,1)', offset: 0 },
        { transform: 'scale(1.18,.82) translateY(4px)', offset: .3 },
        { transform: 'scale(.9,1.1) translateY(-7px)', offset: .55 },
        { transform: 'scale(1.04,.96)', offset: .8 },
        { transform: 'scale(1,1)', offset: 1 }
      ], { duration: 540, delay: i * 90 + 600, easing: 'ease-out' });
    }
  }
  const tl = disp.querySelector('.fate-total');
  if (tl) tl.textContent = t('fate_total', results.reduce((a, b) => a + b, 0));
}
function renderFate() {
  document.querySelectorAll('#fate-btns .cat-btn').forEach(b => { b.classList.toggle('active', b.dataset.fate === fateMode); b.textContent = t('fate_' + b.dataset.fate); });
  document.getElementById('fate-opts').style.display = fateMode === 'dice' ? '' : 'none';
  const btn = document.getElementById('fate-btn');
  btn.textContent = fateMode === 'dice' ? t('fate_roll') : fateMode === 'yesno' ? t('fate_ask') : t('fate_draw');
  document.getElementById('fate-count').previousSibling; // noop
  if (!fateRolling) {
    document.getElementById('fate-display').innerHTML = `<div class="shuffle-empty">${fateMode === 'dice' ? t('fate_hint_dice') : fateMode === 'yesno' ? t('fate_hint_yesno') : t('fate_hint_fortune')}</div>`;
  }
}
function fateRoll() {
  if (fateRolling) return;
  fateRolling = true;
  const btn = document.getElementById('fate-btn');
  btn.disabled = true;
  btn.textContent = fateMode === 'dice' ? t('fate_rolling_dice') : fateMode === 'yesno' ? t('fate_rolling_yesno') : t('fate_rolling_fortune');
  const disp = document.getElementById('fate-display');
  if (fateMode === 'dice') {
    disp.innerHTML = buildDice(fateCount);
    startDiceTumble(disp);
  }
  let count = 0;
  const interval = setInterval(() => {
    if (fateMode !== 'dice') {
      const pool = fateList(fateMode);
      disp.innerHTML = `<div class="shuffle-pick">${esc(pool[Math.floor(Math.random() * pool.length)])}</div>`;
    }
    count++;
    if (count > 13) {
      clearInterval(interval);
      fateRolling = false;
      btn.disabled = false;
      btn.textContent = fateMode === 'dice' ? t('fate_again_dice') : t('fate_again');
      if (fateMode === 'dice') {
        landDice(disp, newRoll());
      } else {
        const pool = fateList(fateMode);
        disp.innerHTML = `<div class="shuffle-pick">${esc(pool[Math.floor(Math.random() * pool.length)])}</div>`;
        const p = disp.querySelector('.shuffle-pick');
        if (p) { p.classList.add('flash'); setTimeout(() => { if (p.classList) p.classList.remove('flash'); }, 600); }
      }
    }
  }, 80);
}
document.querySelectorAll('#fate-btns .cat-btn').forEach(btn => btn.addEventListener('click', () => { fateMode = btn.dataset.fate; renderFate(); }));
document.getElementById('fate-count').addEventListener('input', e => { const v = parseInt(e.target.value, 10); if (!isNaN(v)) fateCount = Math.min(3, Math.max(1, v)); });
document.getElementById('fate-btn').addEventListener('click', fateRoll);
renderFate();

/* ---- VERSUS (淘汰赛) ---- */
let vsItems = [];
let vsPairs = [];
let vsWinners = [];
let vsRound = 1;
let vsBye = null;
let vsDone = false;
let vsActive = false;

function addVsItem() {
  const input = document.getElementById('vs-input');
  const v = input.value.trim();
  input.value = '';
  if (!v) return;
  if (vsItems.includes(v)) {
    document.getElementById('vs-empty').textContent = t('vs_dup', v);
    return;
  }
  vsItems.push(v);
  vsReset(true);
  renderVsChips();
}
function vsReset(keepItems) {
  if (!keepItems) vsItems = [];
  vsPairs = []; vsWinners = []; vsRound = 1; vsBye = null; vsDone = false; vsActive = false;
  renderVsStage();
}
function startVs() {
  if (vsItems.length < 2) { document.getElementById('vs-empty').textContent = t('vs_need2'); return; }
  const pool = vsItems.slice().sort(() => Math.random() - 0.5);
  vsDone = false; vsActive = true; vsRound = 1;
  buildRound(pool);
}
function buildRound(pool) {
  vsPairs = []; vsWinners = []; vsBye = null;
  for (let i = 0; i + 1 < pool.length; i += 2) vsPairs.push([pool[i], pool[i + 1]]);
  if (pool.length % 2 === 1) vsBye = pool[pool.length - 1];
  renderVsStage();
}
function pickVs(win) {
  vsWinners.push(win);
  vsPairs.shift();
  if (!vsPairs.length) {
    if (vsBye != null) { vsWinners.push(vsBye); vsBye = null; }
    if (vsWinners.length === 1) { vsDone = true; vsActive = false; }
    else { vsRound++; buildRound(vsWinners.slice()); return; }
  }
  renderVsStage();
}
function renderVsStage() {
  const stage = document.getElementById('vs-stage');
  const empty = document.getElementById('vs-empty');
  const actions = document.getElementById('vs-actions');
  const startBtn = document.getElementById('vs-start');
  if (!vsActive && !vsDone) {
    empty.style.display = '';
    actions.style.display = '';
    stage.style.display = 'none';
    startBtn.textContent = t('vs_start');
    empty.textContent = vsItems.length < 2 ? t('vs_need2') : t('vs_added', vsItems.length);
    return;
  }
  empty.style.display = 'none';
  actions.style.display = vsActive ? 'none' : '';
  startBtn.textContent = vsDone ? t('vs_again') : t('vs_start');
  stage.style.display = '';
  if (vsDone) {
    stage.innerHTML = `<div class="vs-win">🏆 ${esc(vsWinners[0])}</div><div class="vs-sub">${t('vs_sub')}</div>`;
    return;
  }
  const pair = vsPairs[0];
  stage.innerHTML = `<div class="vs-round">${t('vs_round', vsRound, vsPairs.length + (vsBye != null ? 1 : 0))}</div>
    <div class="vs-hint">${t('vs_hint')}</div>
    ${vsBye != null ? `<div class="vs-bye">${t('vs_bye', esc(vsBye))}</div>` : ''}
    <div class="vs-duel">
      <button class="vs-card" data-side="0">${esc(pair[0])}</button>
      <button class="vs-card" data-side="1">${esc(pair[1])}</button>
    </div>`;
  stage.querySelectorAll('.vs-card').forEach(btn => btn.addEventListener('click', () => pickVs(vsPairs[0][+btn.dataset.side])));
}
function renderVsChips() {
  const el = document.getElementById('vs-chips');
  el.innerHTML = vsItems.map((item, i) => `<span class="chip">${esc(item)}<button data-idx="${i}">x</button></span>`).join('');
  el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { vsItems.splice(+btn.dataset.idx, 1); vsReset(true); renderVsChips(); }));
}
document.getElementById('vs-add').addEventListener('click', addVsItem);
document.getElementById('vs-input').addEventListener('keydown', e => { if (e.key === 'Enter') addVsItem(); });
document.getElementById('vs-start').addEventListener('click', startVs);
document.getElementById('vs-clear').addEventListener('click', () => { vsReset(false); renderVsChips(); });
let vsPickSize = 8;
document.getElementById('vs-size').addEventListener('click', () => {
  vsPickSize = vsPickSize === 4 ? 8 : vsPickSize === 8 ? 16 : 4;
  document.getElementById('vs-size').textContent = t('vs_size', vsPickSize);
});
document.getElementById('vs-size').textContent = t('vs_size', vsPickSize);
document.getElementById('vs-auto').addEventListener('click', () => {
  const pool = poolFor(shuffleCat);
  if (pool.length < 2) { document.getElementById('vs-empty').textContent = t('vs_too_few'); renderVsStage(); return; }
  const take = Math.min(vsPickSize, pool.length);
  vsItems = pool.slice().sort(() => Math.random() - 0.5).slice(0, take);
  vsReset(true);
  renderVsChips();
  startVs();
});
renderVsChips();
renderVsStage();

/* ---- RECORDS ---- */
const REC_KEY = 'justpick_records';

function stateToJSON() {
  const q = document.getElementById('weigh-q').value.trim();
  return JSON.stringify({
    v: 1,
    decks: wheelDecks.map(d => ({ n: d.name, items: d.items.slice() })),
    activeDeck,
    q,
    weigh: JSON.parse(JSON.stringify(weighOptions)),
    cat: shuffleCat,
    vs: vsItems.slice(),
    cust: JSON.parse(JSON.stringify(customDaily)),
    scCrits: scoreCrits.map(c => ({ n: c.name, w: c.w }))
  });
}
function encodeRecord() {
  let bin = '';
  new TextEncoder().encode(stateToJSON()).forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function decodeRecord(code) {
  const bin = atob(code.replace(/\s+/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function applyRecord(data) {
  if (!data || data.v !== 1) throw new Error('bad format');
  if (Array.isArray(data.decks) && data.decks.length) {
    wheelDecks = data.decks.map(d => ({
      name: String((d && d.n) || '转盘'),
      items: (Array.isArray(d && d.items) ? d.items : []).filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean)
    }));
    if (!wheelDecks.length) wheelDecks = [{ name: '转盘 1', items: [] }];
    activeDeck = Math.min(Math.max(0, +data.activeDeck || 0), wheelDecks.length - 1);
    wheelItems = wheelDecks[activeDeck].items;
  } else if (Array.isArray(data.wheel)) {
    // 旧记录码：单转盘
    const items = data.wheel.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean);
    wheelDecks = [{ name: '转盘 1', items: items.length ? items : [] }];
    activeDeck = 0;
    wheelItems = wheelDecks[0].items;
  }
  if (typeof data.q === 'string') document.getElementById('weigh-q').value = data.q;
  if (Array.isArray(data.weigh) && data.weigh.length) {
    weighOptions = data.weigh.map(o => ({
      name: o && typeof o.name === 'string' ? o.name : '',
      pros: Array.isArray(o.pros) && o.pros.length ? o.pros.map(String) : [""],
      cons: Array.isArray(o.cons) && o.cons.length ? o.cons.map(String) : [""],
      scores: Array.isArray(o && o.scores) ? o.scores.slice(0, 5).map(x => c15(x)) : [],
      manual: !!(o && o.manual)
    }));
  }
  if (data.cat && catQs[data.cat]) shuffleCat = data.cat;
  if (Array.isArray(data.vs)) {
    const vs = data.vs.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean);
    if (vs.length) vsItems = vs;
    vsReset(true);
    renderVsChips();
  }
  if ((data.scCrits && Array.isArray(data.scCrits) && data.scCrits.length) || (data.sc && Array.isArray(data.sc.crits) && data.sc.crits.length)) {
    const crits = (data.scCrits && data.scCrits.length) ? data.scCrits : data.sc.crits;
    scoreCrits = crits.slice(0, 5).map(c => ({ name: String((c && c.n) || ''), w: c15(parseInt(c && c.w, 10) || 3) }));
  }
  // 兼容旧记录码：若 weigh 没有 scores，回退到旧的 sc.opts
  if (data.sc && Array.isArray(data.sc.opts)) {
    weighOptions.forEach((o, i) => {
      const old = data.sc.opts[i];
      if ((!o.scores || !o.scores.length) && old && Array.isArray(old.s)) o.scores = old.s.slice(0, 5).map(x => c15(x));
    });
  }
  if (data.cust && typeof data.cust === 'object') {
    Object.keys(customDaily).forEach(k => {
      if (Array.isArray(data.cust[k])) {
        const arr = data.cust[k].filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean);
        if (arr.length) customDaily[k] = arr;
      }
    });
  }
  showWeighResult = false;
  document.getElementById('spin-result').innerHTML = '';
  document.getElementById('weigh-result').innerHTML = '';
  renderChips();
  drawWheel(wheelAngle);
  renderDecks();
  renderDeckSelect();
  renderWeigh();
  renderCats();
  renderCustomChips();
}
function recordMsg(text, ok) {
  const el = document.getElementById('record-msg');
  el.textContent = text;
  el.className = 'record-msg ' + (ok ? 'ok' : 'err');
}
function copyText(t) {
  const done = () => recordMsg(t('rec_copied'), true);
  const fail = () => {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    recordMsg(ok ? t('rec_copied') : t('rec_copy_fail'), ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fail);
  else fail();
}
function getHistory() { try { return JSON.parse(localStorage.getItem(REC_KEY)) || []; } catch (e) { return []; } }
function setHistory(h) { try { localStorage.setItem(REC_KEY, JSON.stringify(h)); } catch (e) {} }
function fmtTime(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory() {
  const list = document.getElementById('record-list');
  const wrap = document.getElementById('record-hist');
  const h = getHistory();
  document.getElementById('record-count').textContent = h.length ? `（${h.length}）` : '';
  wrap.hidden = !h.length;
  list.innerHTML = h.map((e, i) => `
    <div class="record-item">
      <div class="record-meta"><span>${fmtTime(e.t)}</span><span>${esc(e.s || '')}</span></div>
      <code class="record-code-sm">${esc(e.code.slice(0, 20))}${e.code.length > 20 ? '…' : ''}</code>
      <div class="record-acts">
        <button data-act="load" data-i="${i}">${t('rec_load')}</button>
        <button data-act="del" data-i="${i}">${t('rec_clear')}</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const h2 = getHistory();
      const item = h2[+btn.dataset.i];
      if (!item) return;
      if (btn.dataset.act === 'load') {
        try {
          applyRecord(decodeRecord(item.code));
          document.getElementById('record-input').value = item.code;
          recordMsg(t('rec_ok'), true);
        } catch (e) { recordMsg(t('rec_broken'), false); }
      } else {
        h2.splice(+btn.dataset.i, 1);
        setHistory(h2);
        renderHistory();
      }
    });
  });
}
function pushHistory(entry) {
  entry.t = Date.now();
  const h = getHistory();
  h.unshift(entry);
  setHistory(h.slice(0, 30));
}
document.getElementById('record-save').addEventListener('click', () => {
  const code = encodeRecord();
  document.getElementById('record-code').textContent = code;
  document.getElementById('record-box').hidden = false;
  document.getElementById('record-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  recordMsg('', true);
  const q = document.getElementById('weigh-q').value.trim();
  const parts = [t('rec_summary_wheel', wheelItems.length)];
  if (vsItems.length) parts.push(t('rec_summary_vs', vsItems.length));
  const customs = Object.values(customDaily).reduce((s, a) => s + a.length, 0);
  if (customs) parts.push(t('rec_summary_custom', customs));
  if (q) parts.push(q.length > 8 ? q.slice(0, 8) + '…' : q);
  pushHistory({ code, s: parts.join(' · ') });
  renderHistory();
});
document.getElementById('record-copy').addEventListener('click', () => copyText(document.getElementById('record-code').textContent));
document.getElementById('record-close').addEventListener('click', () => { document.getElementById('record-box').hidden = true; });
document.getElementById('record-clear').addEventListener('click', () => {
  if (getHistory().length && confirm(t('rec_confirm_clear'))) { setHistory([]); renderHistory(); }
});
function loadFromInput() {
  const code = document.getElementById('record-input').value.trim();
  if (!code) { recordMsg(t('rec_need'), false); return; }
  try {
    applyRecord(decodeRecord(code));
    recordMsg(t('rec_ok'), true);
  } catch (e) { recordMsg(t('rec_bad'), false); }
}
document.getElementById('record-load').addEventListener('click', loadFromInput);
document.getElementById('record-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromInput(); });
renderHistory();

/* ===== PWA：注册 Service Worker，实现离线可用 ===== */
(function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;          // 仅在 HTTPS / localhost 下可用
  if (location.protocol === 'file:') return;            // 直接双击本地文件时不注册
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service Worker 注册失败：', err);
    });
  });
  // 提示可安装为主屏幕 App（浏览器弹出安装提示时）
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    console.log('PWA 可安装');
  });
})();
/* ===== PWA 结束 ===== */
